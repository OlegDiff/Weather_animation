<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Europe - Weather Map</title><link rel="stylesheet" href="style.css?v=mobile-map-2"></head>
<body><main id="weather-map">
<div class="map-viewport"><canvas class="map-canvas" width="1600" height="900" role="img" aria-label="Weather in European cities"></canvas></div>
<div class="map-controls">
 <div class="mode-switch" role="group" aria-label="Weather mode">
  <label><input type="radio" name="weather-mode" data-mode value="demo" checked><span>DEMO</span></label>
  <label><input type="radio" name="weather-mode" data-mode value="live"><span>REAL</span></label>
 </div>
 <ul class="weather-legend" aria-label="Weather legend">
  <li><svg class="legend-icon sun" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="6"/><path d="M16 2v4m0 20v4M2 16h4m20 0h4M6 6l3 3m14 14 3 3M6 26l3-3M23 9l3-3"/></svg><span>Sunny</span></li>
  <li><svg class="legend-icon cloud" viewBox="0 0 32 32" aria-hidden="true"><path d="M8 25a6 6 0 0 1-1-12 9 9 0 0 1 17-2 7 7 0 0 1 0 14Z"/></svg><span>Cloudy</span></li>
  <li><span class="legend-letters rain" aria-hidden="true">Aa</span><span>Rain</span></li>
  <li><span class="legend-letters snow" aria-hidden="true">Aa<span>&#10052;</span></span><span>Snow</span></li>
  <li><canvas class="legend-wind" width="48" height="36" aria-hidden="true"></canvas><span>Wind</span></li>
 </ul>
</div>
<p class="data-source">Weather data: <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a></p>
<span class="visually-hidden" data-status role="status" aria-live="polite"></span>
</main><script src="map-cities.js"></script><script src="app.js?v=mobile-map-2"></script></body></html>
